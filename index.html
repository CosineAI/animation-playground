<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pirate's Cove Playground</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <header id="project-bar" aria-label="Pirate voyage picker">
    <label for="project-select">Voyage</label>
    <select id="project-select"></select>
  </header>

  <aside id="cat-card" aria-label="Ship cat">
    <img
      id="cat-image"
      src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?auto=format&fit=crop&w=900&q=80"
      alt="A cat looking toward the camera"
    >
  </aside>

  <button id="controls-toggle" type="button" aria-expanded="true" aria-controls="controls">Strike Sails</button>
  <section id="controls" aria-label="Animation controls"></section>
  <script type="module" src="assets/main.js"></script>
</body>
</html>
