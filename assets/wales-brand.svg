<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081423"/>
      <stop offset="44%" stop-color="#0f2334"/>
      <stop offset="100%" stop-color="#1e140d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(255,226,163,0.14)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2334"/>
      <stop offset="100%" stop-color="#081423"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e140d"/>
      <stop offset="100%" stop-color="#0f2334"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d130d"/>
      <stop offset="100%" stop-color="#6c4523"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2334"/>
      <stop offset="100%" stop-color="#081423"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c4523"/>
      <stop offset="100%" stop-color="#3a2112"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(245,225,176,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#f5e1b0" opacity="0.5">
    <circle cx="120" cy="80" r="1.2"/>
    <circle cx="340" cy="140" r="0.8" opacity="0.3"/>
    <circle cx="560" cy="60" r="1.5"/>
    <circle cx="780" cy="110" r="0.9" opacity="0.4"/>
    <circle cx="920" cy="50" r="1.1"/>
    <circle cx="1150" cy="90" r="1.3"/>
    <circle cx="1380" cy="130" r="0.7" opacity="0.35"/>
    <circle cx="1500" cy="70" r="1"/>
  </g>

  <!-- Moon / distant glow -->
  <circle cx="1280" cy="160" r="45" fill="#f5e1b0" opacity="0.06" filter="url(#blur)"/>
  <circle cx="1280" cy="160" r="22" fill="#f7dfad" opacity="0.12" filter="url(#softBlur)"/>

  <!-- Clouds / mist layers -->
  <g fill="rgba(255,241,213,0.05)" filter="url(#blur)">
    <ellipse cx="400" cy="200" rx="280" ry="35"/>
    <ellipse cx="1100" cy="260" rx="320" ry="28"/>
    <ellipse cx="750" cy="180" rx="200" ry="20"/>
  </g>

  <!-- Far mountains -->
  <path d="M0,450 Q180,260 420,380 T780,320 T1050,360 T1400,290 T1600,340 L1600,900 L0,900 Z" fill="url(#mountain1)" opacity="0.85"/>

  <!-- Mid mountains -->
  <path d="M0,520 Q220,340 480,440 T900,380 T1300,410 T1600,360 L1600,900 L0,900 Z" fill="url(#mountain2)" opacity="0.9"/>

  <!-- Snowdonia-like peak -->
  <path d="M420,440 L530,210 L640,440 Z" fill="#0f2334" opacity="0.7"/>
  <path d="M520,240 L530,210 L545,235 L535,260 Z" fill="#f5e1b0" opacity="0.08"/>

  <!-- Near rolling hills -->
  <path d="M0,600 Q300,480 600,560 T1100,520 T1600,580 L1600,900 L0,900 Z" fill="url(#hills)"/>

  <!-- Coastline / sea -->
  <rect x="0" y="650" width="1600" height="250" fill="url(#water)"/>
  <path d="M0,650 Q200,640 400,655 T800,645 T1200,660 T1600,650 L1600,900 L0,900 Z" fill="url(#water)" opacity="0.6"/>

  <!-- Waves / water texture -->
  <g stroke="#f5e1b0" fill="none" opacity="0.08" stroke-width="1.5">
    <path d="M100,720 Q160,700 220,720 T340,720"/>
    <path d="M450,760 Q510,740 570,760 T690,760"/>
    <path d="M800,700 Q860,680 920,700 T1040,700"/>
    <path d="M1150,750 Q1210,730 1270,750 T1390,750"/>
    <path d="M200,800 Q260,780 320,800 T440,800"/>
    <path d="M600,820 Q660,800 720,820 T840,820"/>
    <path d="M950,790 Q1010,770 1070,790 T1190,790"/>
    <path d="M1300,810 Q1360,790 1420,810 T1540,810"/>
  </g>

  <!-- Cliffs (Welsh coast) -->
  <path d="M1100,520 L1130,320 L1165,350 L1190,280 L1220,330 L1250,260 L1280,340 L1310,300 L1350,370 L1380,290 L1420,360 L1460,270 L1500,340 L1540,310 L1600,400 L1600,900 L1100,900 Z" fill="url(#cliff)"/>

  <!-- Cliff highlights -->
  <path d="M1130,320 L1145,335 L1135,360 L1130,380 L1130,320" fill="#6c4523" opacity="0.5"/>
  <path d="M1190,280 L1205,300 L1195,330 L1190,350 L1190,280" fill="#6c4523" opacity="0.45"/>
  <path d="M1250,260 L1265,280 L1255,310 L1250,330 L1250,260" fill="#6c4523" opacity="0.5"/>
  <path d="M1310,300 L1325,320 L1315,350 L1310,370 L1310,300" fill="#6c4523" opacity="0.4"/>
  <path d="M1380,290 L1395,310 L1385,340 L1380,360 L1380,290" fill="#6c4523" opacity="0.5"/>
  <path d="M1460,270 L1475,290 L1465,320 L1460,340 L1460,270" fill="#6c4523" opacity="0.45"/>
  <path d="M1540,310 L1555,330 L1545,360 L1540,380 L1540,310" fill="#6c4523" opacity="0.4"/>

  <!-- Castle / tower ruin -->
  <g fill="#2b1a0e">
    <rect x="360" y="480" width="14" height="40"/>
    <rect x="370" y="470" width="12" height="50"/>
    <rect x="378" y="460" width="10" height="60"/>
    <path d="M360,480 L374,465 L388,480" fill="#2b1a0e"/>
    <path d="M378,460 L388,450 L398,460" fill="#2b1a0e"/>
    <rect x="385" y="485" width="8" height="35" opacity="0.7"/>
    <rect x="392" y="475" width="6" height="45" opacity="0.6"/>
  </g>

  <!-- Castle warm window light -->
  <rect x="372" y="490" width="3" height="5" fill="#f7dfad" opacity="0.45"/>
  <rect x="381" y="480" width="2" height="4" fill="#f7dfad" opacity="0.35"/>

  <!-- Village / cottage lights -->
  <g fill="#f7dfad">
    <rect x="520" y="545" width="4" height="4" opacity="0.5"/>
    <rect x="545" y="540" width="3" height="3" opacity="0.4"/>
    <rect x="580" y="550" width="5" height="5" opacity="0.55"/>
    <rect x="610" y="535" width="3" height="3" opacity="0.35"/>
    <rect x="640" y="548" width="4" height="4" opacity="0.45"/>
  </g>
  <g fill="#f7dfad" opacity="0.12" filter="url(#softBlur)">
    <circle cx="522" cy="547" r="8"/>
    <circle cx="582" cy="552" r="10"/>
    <circle cx="642" cy="550" r="9"/>
  </g>

  <!-- Foreground land -->
  <path d="M0,750 Q250,700 500,780 T1000,740 T1600,800 L1600,900 L0,900 Z" fill="#1d130d"/>

  <!-- Celtic knot / dragon stylised silhouette on cliff -->
  <path d="M1200,420 Q1215,400 1230,415 T1250,400 T1265,415 T1280,405 L1280,430 Q1265,440 1250,430 T1230,440 T1215,430 Z" fill="#081423" opacity="0.7"/>

  <!-- Welsh name -->
  <text x="80" y="820" font-family="Georgia, serif" font-size="28" fill="#f5e1b0" opacity="0.25" letter-spacing="0.12em">CYMRU</text>

  <!-- Mist overlay -->
  <rect width="1600" height="900" fill="url(#mist)" pointer-events="none"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
    <stop offset="70%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(8,20,35,0.45)"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
</svg>